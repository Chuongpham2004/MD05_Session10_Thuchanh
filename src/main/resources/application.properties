spring.application.name=Webservice_Session04_JPA

#Load biến môi trường từ file .env (chỉ dùng khi chạy local, file này không commit)
spring.config.import=optional:file:.env[.properties]

#Config Datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jb_ioc_251229_ss4}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

#Config JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Config pageSize
pageSize = 2