services:
  postgres:
    image: postgres:16-alpine
    container_name: ss04-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKERHUB_USERNAME}/webservice-session04-jpa:${IMAGE_TAG:-latest}
    container_name: ss04-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Spring Boot tự map các biến này, ghi đè application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
